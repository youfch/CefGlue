name: Build CEF Redist Packages

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: 'CEF version (e.g. 149.0.4)'
        required: true
        default: '149.0.4'
      commit_hash:
        description: 'CEF commit hash (e.g. g2f1bfd8)'
        required: true
        default: 'g2f1bfd8'
      chromium_version:
        description: 'Chromium version (e.g. 149.0.7827.156)'
        required: true
        default: '149.0.7827.156'

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        arch: [linux64, linuxarm64]
    runs-on: ubuntu-latest
    steps:
      - name: Install cross-strip for ARM64
        if: matrix.arch == 'linuxarm64'
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Download CEF
        run: |
          URL="https://cef-builds.spotifycdn.com/cef_binary_${{ inputs.cef_version }}%2B${{ inputs.commit_hash }}%2Bchromium-${{ inputs.chromium_version }}_${{ matrix.arch }}_minimal.tar.bz2"
          curl -L -o cef.tar.bz2 "$URL"

      - name: Extract CEF
        run: |
          mkdir -p cef_binaries out/CEF
          tar -xjf cef.tar.bz2 -C cef_binaries
          RELEASE_DIR=$(find cef_binaries -type d -name "Release" | head -1)
          cp -a "$RELEASE_DIR"/. out/CEF/
          RESOURCES_DIR=$(find cef_binaries -type d -name "Resources" | head -1)
          cp -a "$RESOURCES_DIR"/. out/CEF/

      - name: Strip debug symbols
        run: |
          STRIP="strip"
          [ "${{ matrix.arch }}" = "linuxarm64" ] && STRIP="aarch64-linux-gnu-strip"
          for so in out/CEF/*.so; do
            [ -f "$so" ] && [ ! -L "$so" ] && $STRIP -s "$so" || true
          done

      - name: Extract API hash (linux64 only)
        if: matrix.arch == 'linux64'
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('out/CEF/libcef.so')
          lib.cef_api_hash.argtypes = [ctypes.c_int, ctypes.c_int]
          lib.cef_api_hash.restype = ctypes.c_char_p
          h = lib.cef_api_hash(14900, 0)
          print(f'LINUX_HASH={h.decode()}')
          with open('api_hash.txt', 'w') as f: f.write(h.decode())
          "

      - name: Create NuGet package
        run: |
          mkdir -p pkg && cd pkg
          dotnet new classlib -n cef.redist.${{ matrix.arch }} --no-restore -f netstandard2.0
          cd cef.redist.${{ matrix.arch }}
          rm -f Class1.cs
          mv ../../out/CEF .
          cat > cef.redist.${{ matrix.arch }}.nuspec << NUSPEC
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd">
            <metadata>
              <id>cef.redist.\$id\$</id>
              <version>${{ inputs.cef_version }}</version>
              <authors>The Chromium Embedded Framework Authors</authors>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>CEF - the Chromium Embedded Framework.</description>
              <copyright>Copyright © 2025</copyright>
              <tags>chrome chromium native embedded browser CEF nativepackage linux</tags>
              <projectUrl>https://github.com/youfch/CefGlue</projectUrl>
            </metadata>
          </package>
          NUSPEC
          cat > cef.redist.${{ matrix.arch }}.csproj << CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <NuspecFile>cef.redist.${{ matrix.arch }}.nuspec</NuspecFile>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="CEF\**\*" PackagePath="CEF\%(RecursiveDir)%(Filename)%(Extension)" />
            </ItemGroup>
          </Project>
          CSPROJ
          dotnet pack --output ../.. -c Release -p:NuspecProperties="id=${{ matrix.arch }};version=${{ inputs.cef_version }}"
          cd ../..
          rm -rf pkg

      - uses: actions/upload-artifact@v4
        with:
          name: cef.redist.${{ matrix.arch }}
          path: |
            ./*.nupkg
            api_hash.txt

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: osx64
            cef_arch: macosx64
            runs-on: macos-13
          - id: osxarm64
            cef_arch: macosarm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Download CEF
        run: |
          URL="https://cef-builds.spotifycdn.com/cef_binary_${{ inputs.cef_version }}%2B${{ inputs.commit_hash }}%2Bchromium-${{ inputs.chromium_version }}_${{ matrix.cef_arch }}_minimal.tar.bz2"
          curl -L -o cef.tar.bz2 "$URL"

      - name: Extract CEF
        run: |
          mkdir -p cef_binaries out/CEF/Resources
          tar -xjf cef.tar.bz2 -C cef_binaries
          RELEASE_DIR=$(find cef_binaries -type d -name "Release" | head -1)
          FW="$RELEASE_DIR/Chromium Embedded Framework.framework"
          cp "$FW/Chromium Embedded Framework" out/CEF/libcef.dylib
          cp "$FW/Libraries/"* out/CEF/ 2>/dev/null || true
          cp "$FW/Resources/"* out/CEF/Resources/ 2>/dev/null || true
          cp "$FW/Resources/en.lproj/"* out/CEF/Resources/ 2>/dev/null || true

      - name: Extract API hash (osx64 only, same hash for arm64)
        if: matrix.id == 'osx64'
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('out/CEF/libcef.dylib')
          lib.cef_api_hash.argtypes = [ctypes.c_int, ctypes.c_int]
          lib.cef_api_hash.restype = ctypes.c_char_p
          h = lib.cef_api_hash(14900, 0)
          print(f'MACOS_HASH={h.decode()}')
          with open('api_hash.txt', 'w') as f: f.write(h.decode())
          "

      - name: Create NuGet package
        run: |
          mkdir -p pkg && cd pkg
          dotnet new classlib -n cef.redist.${{ matrix.id }} --no-restore -f netstandard2.0
          cd cef.redist.${{ matrix.id }}
          rm -f Class1.cs
          mv ../../out/CEF .
          cat > cef.redist.${{ matrix.id }}.csproj << CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>cef.redist.${{ matrix.id }}</PackageId>
              <Version>${{ inputs.cef_version }}</Version>
              <Authors>The Chromium Embedded Framework Authors</Authors>
              <Description>CEF - the Chromium Embedded Framework.</Description>
              <Copyright>Copyright © 2025</Copyright>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoDefaultExcludes>true</NoDefaultExcludes>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="CEF\**\*" PackagePath="CEF\%(RecursiveDir)%(Filename)%(Extension)" />
            </ItemGroup>
          </Project>
          CSPROJ
          dotnet pack --output ../.. -c Release
          cd ../..
          rm -rf pkg

      - uses: actions/upload-artifact@v4
        with:
          name: cef.redist.${{ matrix.id }}
          path: |
            ./*.nupkg
            api_hash.txt

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Extract API hashes
        run: |
          echo "### API Hashes" >> /tmp/release-notes
          echo '```' >> /tmp/release-notes
          for f in packages/api_hash.txt; do
            if [ -f "$f" ]; then
              echo "Hash from $f: $(cat $f)" >> /tmp/release-notes
            fi
          done
          echo '```' >> /tmp/release-notes
          find packages -name "*.nupkg" -exec ls -lh {} \;
          find packages -name "api_hash.txt" -exec cat {} \;

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cef-redist-${{ inputs.cef_version }}
          name: "CEF Redist ${{ inputs.cef_version }}"
          body: |
            CEF redistributable NuGet packages for ${{ inputs.cef_version }}
            (CEF ${{ inputs.cef_version }}+${{ inputs.commit_hash }}+chromium-${{ inputs.chromium_version }})

            | Package | Platform |
            |---------|----------|
            | `cef.redist.linux64` | Linux x64 |
            | `cef.redist.linuxarm64` | Linux ARM64 |
            | `cef.redist.osx64` | macOS x64 (Intel) |
            | `cef.redist.osxarm64` | macOS ARM64 (Apple Silicon) |

            Add as local NuGet source then reference in `Directory.Packages.props`.

            > **API hashes**: See the `api_hash.txt` files in the artifacts for `CEF_API_HASH_PLATFORM_LINUX` and `CEF_API_HASH_PLATFORM_MACOS`.
          files: packages/*.nupkg
